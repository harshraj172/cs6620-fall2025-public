name: Docker Build, Push, and Deploy

on:
  push:
    branches: [ "week02" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set build date
      run: echo "BUILD_DATE=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_ENV"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:${{ github.sha }}
        build-args: |
          BUILD_DATE=${{ env.BUILD_DATE }}
          GIT_SHA=${{ github.sha }}
        labels: |
          org.opencontainers.image.source=${{ github.event.repository.html_url }}
          org.opencontainers.image.revision=${{ github.sha }}
          build.source=github-actions
          build.workflow=${{ github.workflow }}
          build.run_id=${{ github.run_id }}
          build.run_number=${{ github.run_number }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Deploy to EC2 with SSM
      id: deploy
      run: |
        IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:latest"
        PARAMS=$(jq -n --arg img "$IMAGE" '{commands: [
          "docker pull \($img)",
          "docker stop cs6620-app || true",
          "docker rm cs6620-app || true",
          "docker run -d --name cs6620-app --restart unless-stopped -p 80:5000 \($img)",
          "docker ps --filter name=cs6620-app"
        ]}')
        COMMAND_ID=$(aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy cs6620-app ${GITHUB_SHA::7} from GitHub Actions run ${{ github.run_id }}" \
          --parameters "$PARAMS" \
          --query "Command.CommandId" --output text)
        echo "SSM command sent: $COMMAND_ID"
        echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

    - name: Verify deployment
      run: |
        aws ssm wait command-executed \
          --command-id "${{ steps.deploy.outputs.command_id }}" \
          --instance-id "${{ secrets.EC2_INSTANCE_ID }}" || true
        aws ssm get-command-invocation \
          --command-id "${{ steps.deploy.outputs.command_id }}" \
          --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
          --query "{Status: Status, Output: StandardOutputContent, Errors: StandardErrorContent}" \
          --output json
        STATUS=$(aws ssm get-command-invocation \
          --command-id "${{ steps.deploy.outputs.command_id }}" \
          --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
          --query Status --output text)
        test "$STATUS" = "Success"
